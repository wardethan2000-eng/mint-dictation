[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxtype"
version = "0.1.0"
description = "Voice-to-text dictation tool"
requires-python = ">=3.8"
license = {text = "GPL-3.0"}
dependencies = [
    "vosk",
    "sounddevice",
    "numpy",
    "pycairo",
    "PyGObject",
    "pynput",
    "python-xlib",
]

[project.scripts]
voxtype = "voxtype.app:main"

[tool.setuptools.packages.find]
include = ["voxtype*"]
